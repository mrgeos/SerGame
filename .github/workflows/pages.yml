name: Deploy to GitHub Pages

# Публикуется свежая версия. Ветка stable-v1 — точка отката на версию
# до переделки уровней, её специально не деплоим.
#
# claude/serega-platformer-game-db86rd — ветка по умолчанию, и окружение
# github-pages пускает деплоить только её: пуш в любую другую падает
# сразу, не начав шаги. Поэтому она тут и остаётся. Если в настройках
# репозитория сделать веткой по умолчанию main, эту строку можно убрать.
on:
  push:
    branches:
      - main
      - claude/serega-platformer-game-db86rd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
